name: Deploy editor to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static editor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Fetch LLVM artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download llvm-artifacts-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern llvm-artifacts.tar.gz \
            --output /tmp/llvm-artifacts.tar.gz
          mkdir -p packages/editor/public
          tar -xzf /tmp/llvm-artifacts.tar.gz -C packages/editor/public
          test -f packages/editor/public/llvm-artifacts/xyo_browser_ir.wasm

      - name: Build
        run: pnpm --filter xyo-editor exec vite build --base=/xyo-editor/
        env:
          # The xyo-cpp worker entry is generated locally; the unified runtime
          # shipped above is what the editor actually uses.
          XYO_WASM: '0'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/editor/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
